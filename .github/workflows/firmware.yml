name: Firmware build

on:
  push:
    paths: ["firmware/**", "software/ufi_host/**", "requirements-test.txt", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "software/ufi_host/**", "requirements-test.txt", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-test.txt
      - name: Clang path-sensitive firmware analysis
        run: python firmware/tools/check_static.py
      - name: Pinned external capture corpus
        env:
          CC: clang
          UFI_SANITIZE: '1'
        run: |
          python firmware/tests/test_flux_corpus.py --download
          python firmware/tests/test_gcr_corpus.py --download
          python firmware/tests/test_hfe_v3_reference.py --download
      - name: Native, host, generated drive code and 6502 checks
        env:
          CC: clang
          UFI_SANITIZE: '1'
          UFI_ANALYZE: '1'
        run: python firmware/tests/check_all.py
      - name: Coverage-guided fuzzing of the parsers and the v2 dispatcher (ASan and UBSan)
        run: python firmware/tests/run_fuzz.py --seconds 30

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0              # git revision for GET_INFO

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build cmake
          arm-none-eabi-gcc --version | head -1

      - name: Cache STM32CubeH7 (HAL, CMSIS, USB device library, FatFs)
        id: cube
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/STM32CubeH7
          key: stm32cubeh7-v1.11.0-sparse-fatfs-submodules

      - name: Fetch STM32CubeH7 v1.11.0 (sparse)
        if: steps.cube.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.11.0 --filter=blob:none --sparse \
            https://github.com/STMicroelectronics/STM32CubeH7.git ~/STM32CubeH7
          cd ~/STM32CubeH7
          git sparse-checkout set Drivers/STM32H7xx_HAL_Driver Drivers/CMSIS/Include \
            Drivers/CMSIS/Device/ST/STM32H7xx Middlewares/ST/STM32_USB_Device_Library \
            Middlewares/Third_Party/FatFs
          git submodule update --init --depth 1

      - name: Build
        run: |
          cmake -S firmware -B firmware/build -G Ninja -DSTM32CUBE_PATH=$HOME/STM32CubeH7
          cmake --build firmware/build 2>&1 | tee build.log
          # our sources build without warnings; ST vendor code is not policed
          ! grep -E "warning:" build.log | grep -v "STM32CubeH7"
          arm-none-eabi-size firmware/build/ufi_firmware.elf

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ufi_firmware-${{ github.sha }}
          path: |
            firmware/build/ufi_firmware.bin
            firmware/build/ufi_firmware.hex
            firmware/build/ufi_firmware.elf
            firmware/build/memory_usage.json
