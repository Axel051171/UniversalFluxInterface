[project]
name = "ufi-host"
version = "0.1.0"
description = "PC host tool for the UFI Flux Engine (UFI Headless board)"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ufi = "ufi_host.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ufi_host"]
